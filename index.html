<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário de Descrição</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0e;
    --surface: #1a1a18;
    --surface2: #222220;
    --border: rgba(255,255,255,0.08);
    --border-focus: rgba(255,255,255,0.3);
    --text: #f0ede6;
    --text-dim: #6b6960;
    --text-label: #a09d94;
    --accent: #d4f04a;
    --accent-dark: #a8c034;
    --mono: 'Courier New', 'Consolas', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 1rem 4rem;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
  }

  header {
    margin-bottom: 2.5rem;
  }

  .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--text);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 1px;
  }

  .field {
    background: var(--surface);
    padding: 14px 16px 12px;
    position: relative;
    transition: background 0.15s;
  }

  .field:focus-within {
    background: var(--surface2);
    z-index: 1;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 5px;
    transition: color 0.15s;
  }

  .field:focus-within label {
    color: var(--accent);
  }

  .field input,
  .field textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    caret-color: var(--accent);
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: var(--text-dim);
    font-weight: 400;
  }

  .field textarea {
    resize: none;
    min-height: 64px;
    line-height: 1.5;
    font-weight: 400;
  }

  .field input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.4);
    cursor: pointer;
  }

  .btn-extract {
    width: 100%;
    margin-top: 16px;
    padding: 14px 20px;
    background: var(--accent);
    color: #0f0f0e;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s, transform 0.08s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-extract:hover { background: #c8e43e; }
  .btn-extract:active { transform: scale(0.99); }

  .result-area {
    display: none;
    margin-top: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .result-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .btn-copy {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    background: transparent;
    border: 1px solid rgba(212,240,74,0.25);
    border-radius: 5px;
    padding: 3px 10px;
    cursor: pointer;
    transition: background 0.12s;
    letter-spacing: 0.05em;
  }

  .btn-copy:hover { background: rgba(212,240,74,0.08); }

  .result-text {
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
    word-break: break-all;
    background: var(--surface2);
  }

  .pipe { color: var(--accent); opacity: 0.6; }

  @media (max-width: 480px) {
    .form-grid { grid-template-columns: 1fr; }
    .field.full { grid-column: 1; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">// cadastro</div>
    <h1>Detalhamento<br>de Ocorrências</h1>
  </header>

  <div class="form-grid">
    <div class="field full">
      <label for="f-nome">Nome comercial do produto</label>
      <input id="f-nome" type="text" placeholder="Nome do produto">
    </div>
    <div class="field">
      <label for="f-marca">Marca ou fabricante</label>
      <input id="f-marca" type="text" placeholder="Ex: Empresa LTDA">
    </div>
    <div class="field">
      <label for="f-ativo">Princípio ativo ou substância, quando aplicável</label>
      <input id="f-ativo" type="text" placeholder="Ex: Diclofenaco sódico">
    </div>
    <div class="field">
      <label for="f-concentracao">Concentração ou especificação técnica</label>
      <input id="f-concentracao" type="text" placeholder="Ex: 300mg ou aço inox estéril">
    </div>
    <div class="field">
      <label for="f-quantidade">Quantidade e Unidade</label>
      <input id="f-quantidade" type="text" placeholder="Ex: 5 caixas ou 10 unidades">
    </div>
    <div class="field full">
      <label for="f-forma">Forma de apresentação</label>
      <input id="f-forma" type="text" placeholder="Ex: solução ou creme">
    </div>
    <div class="field full">
      <label for="f-lote">Número(s) de lote, serial ou partnumber</label>
      <input id="f-lote" type="text" placeholder="Ex: 1254tg">
    </div>
    <div class="field full">
      <label for="f-data">Prazo de validade</label>
      <input id="f-data" type="text" placeholder="Ex: 30/06/2026">
    </div>
    <div class="field full">
      <label for="f-obs">Informações adicionais sobre a ocorrência: Indicar se foi apresentada prescrição, relatório médico ou outro documento relevante para a análise; Indicar se o produto estava com a embalagem conservada, se havia indícios de fraude ou adulteração, ou demais características relevantes</label>
      <textarea id="f-obs" placeholder="Informações adicionais..."></textarea>
    </div>
  </div>

  <button class="btn-extract" onclick="extrair()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Gerar texto
  </button>

  <div id="result-area" class="result-area">
    <div class="result-header">
      <span class="result-label">Resultado</span>
      <button class="btn-copy" id="btn-copy" onclick="copiar()">Copiar</button>
    </div>
    <div id="result-text" class="result-text"></div>
  </div>
</div>

<script>
  var campos = [
    { id: 'f-nome' },
    { id: 'f-marca' },
    { id: 'f-ativo' },
    { id: 'f-concentracao' },
    { id: 'f-quantidade' },
    { id: 'f-forma' },
    { id: 'f-lote' },
    { id: 'f-data' },
    { id: 'f-obs' }
  ];

  function extrair() {
    var valores = campos.map(function(c) {
      return document.getElementById(c.id).value.trim();
    });

    valores = valores.map(function(v) { return v.toUpperCase(); });

    var texto = valores.join('|');

    // Render com pipes coloridos
    var html = valores.map(function(v) {
      return '<span>' + escHtml(v) + '</span>';
    }).join('<span class="pipe">|</span>');

    document.getElementById('result-text').innerHTML = html;
    document.getElementById('result-area').style.display = 'block';
    document.getElementById('btn-copy').textContent = 'Copiar';
    document.getElementById('result-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Guarda texto puro para copiar
    document.getElementById('result-area').dataset.raw = texto;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function copiar() {
    var texto = document.getElementById('result-area').dataset.raw || '';
    navigator.clipboard.writeText(texto).then(function() {
      var btn = document.getElementById('btn-copy');
      btn.textContent = 'Copiado!';
      setTimeout(function() { btn.textContent = 'Copiar'; }, 1500);
    });
  }
</script>
</body>
</html>
